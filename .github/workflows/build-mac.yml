name: Build macOS App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mac/**'
      - '.github/workflows/build-mac.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mac/**'

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build DroidLink macOS app
      working-directory: mac/DroidLink
      run: |
        xcodebuild build \
          -scheme DroidLink \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty

    - name: Run Tests
      working-directory: mac/DroidLink
      run: |
        xcodebuild test \
          -scheme DroidLink \
          -configuration Debug \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
      continue-on-error: true

  release:
    needs: build
    runs-on: macos-14
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build Release
      working-directory: mac/DroidLink
      run: |
        xcodebuild build \
          -scheme DroidLink \
          -configuration Release \
          -destination 'platform=macOS' \
          -archivePath build/DroidLink.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DroidLink-macOS
        path: mac/DroidLink/build/
        retention-days: 30
